[package]
name = "osd-formats"
version.workspace = true
edition.workspace = true
description = "Open Synth Descriptors to and from the pencilresearch/midi CSV, its triggers CSV, Electra One presets, MIDNAM, OSCQuery and the MIDI 2.0 controller list; the Deluge device definition and the KnobKraft Orm adaptation skeleton are exported only."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "osc", "synthesizer", "descriptor"]
categories = ["multimedia::audio", "parser-implementations"]

[dependencies]
osd.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
