[workspace]
resolver = "2"
members = ["osd", "osd-cli", "osd-formats"]
exclude = ["tools/osc-bridge-parity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roomi-fields/open-synth-descriptors"

[workspace.dependencies]
osd = { path = "osd", version = "0.1.0" }
osd-formats = { path = "osd-formats", version = "0.1.0" }

# The tests check the whole catalogue against the schemas: the libraries
# they use run optimised.
[workspace.metadata.grillhouse.frontieres]
osd = []
osd-cli = ["osd", "osd-formats"]
osd-formats = ["osd"]

[profile.dev.package."*"]
opt-level = 2
