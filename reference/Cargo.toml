[package]
name = "reference"
version.workspace = true
edition.workspace = true
description = "osd-reference: builds the reference pages of a version of the format from its schemas."
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "osd_reference"
path = "src/lib.rs"

[[bin]]
name = "osd-reference"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
toml = "1"
