[package]
name = "osd"
version.workspace = true
edition.workspace = true
description = "The reference reader of Open Synth Descriptors: descriptors read strictly into types, maker profiles and shared MIDI resolved."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "osc", "synthesizer", "descriptor"]
categories = ["multimedia::audio", "parser-implementations"]

[dependencies]
# The Unicode simple case folding of the rules on port names.
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode-case"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
# The Rust lexer of the guard on the consumers of the interface.
proc-macro2 = "1"
tempfile = "3"
toml = "1"
serde_yaml_ng = "0.10"

[[bench]]
name = "catalogue"
harness = false
