[package]
name = "osd-cli"
version = "0.1.0"
edition = "2021"
description = "The osd command: validate, convert and start an Open Synth Descriptors file."
license = "MIT OR Apache-2.0"
repository = "https://github.com/roomi-fields/open-synth-descriptors"
keywords = ["midi", "osc", "synthesizer", "descriptor"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "osd"
path = "src/main.rs"

[dependencies]
osd = { version = "0.1.0", path = "../osd" }

[dev-dependencies]
osd = { version = "0.1.0", path = "../osd" }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
